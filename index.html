<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek EN/ZH Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>English-Chinese Translator</h1>
        <p class="subtitle">Mainland China, Taiwan, Hong Kong Written Chinese, and Hong Kong Spoken Cantonese</p>

        <label for="inputText">Input Text</label>
        <textarea id="inputText" placeholder="Enter English or Chinese text..."></textarea>

        <div class="controls-grid">
            <div class="control">
                <label for="sourceLanguage">Source Language</label>
                <select id="sourceLanguage">
                    <option value="auto">Auto Detect</option>
                    <option value="en">English</option>
                    <option value="zh">Chinese</option>
                </select>
            </div>

            <div class="control">
                <label for="targetVariant">Target Variant</label>
                <select id="targetVariant">
                    <option value="en_us">English (Natural)</option>
                    <option value="zh_cn">Chinese - Mainland China (简体)</option>
                    <option value="zh_tw">Chinese - Taiwan (繁體)</option>
                    <option value="zh_hk_written">Chinese - Hong Kong Written (繁體書面語)</option>
                    <option value="zh_hk_spoken">Chinese - Hong Kong Spoken Cantonese (口語粵語)</option>
                </select>
            </div>

            <div class="control">
                <label for="toneStyle">Tone / Style</label>
                <select id="toneStyle">
                    <option value="natural">Natural</option>
                    <option value="formal">Formal</option>
                    <option value="friendly">Friendly</option>
                    <option value="social">Social / Emoji-friendly</option>
                </select>
            </div>
        </div>

        <button id="translateButton" type="button">Translate</button>
        <p id="statusText" class="status">Ready.</p>

        <section>
            <h2>Output</h2>
            <div id="resultBox" class="output">Your translation appears here.</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
